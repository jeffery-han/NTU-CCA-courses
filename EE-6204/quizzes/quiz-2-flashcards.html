<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EE-6204 Quiz 2 Flashcards</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--ac:#2563eb;--mut:#667085;--ok:#16a34a;--no:#dc2626;--bd:#d6dae1}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9ef;--card:#1c2130;--ac:#6ea0ff;--mut:#98a2b3;--bd:#2f3648}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:.2rem 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
select,button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:240px;padding:24px;margin:12px 0;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.tag{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600}.a{font-size:1.05rem}
.hint{color:var(--mut);font-size:.85rem;margin-top:14px}
.row{display:flex;gap:8px}.row button{flex:1}
.ok{color:var(--ok)}.no{color:var(--no)}
</style></head><body><main>
<h1>EE-6204 Quiz 2 flashcards</h1>
<div class="bar">
<select id="topic"></select>
<label><input type="checkbox" id="onlyMiss"> only cards marked "again"</label>
<button id="shuf">Shuffle</button><button id="reset">Reset progress</button>
</div>
<div id="stat" class="hint"></div>
<div class="card" id="card" tabindex="0"><div class="tag" id="tag"></div><div id="txt"></div><div class="hint" id="h">Click / Space to flip</div></div>
<div class="row"><button id="prev">← Prev</button><button id="again" class="no">✗ Again</button><button id="got" class="ok">✓ Got it</button><button id="next">Next →</button></div>
<script>
const CARDS=[{"t": "Distributions", "f": "Geometric(p): pmf, mean, memoryless?", "b": "P(X=k)=(1−p)^(k−1)·p, k=1,2,… (trials until 1st success). E[X]=1/p. Memoryless: P(X>m+n | X>m)=P(X>n). The only memoryless discrete law."}, {"t": "Distributions", "f": "Exponential(λ): pdf, cdf, mean, variance", "b": "f(t)=λe^(−λt); P(T≤t)=1−e^(−λt); P(T>t)=e^(−λt); E[T]=1/λ; Var=1/λ². Memoryless — the continuous analogue of geometric."}, {"t": "Distributions", "f": "Poisson(λt) random variable: pmf, mean, variance", "b": "P(N=k)=e^(−λt)(λt)^k/k!, k=0,1,… Mean = variance = λt."}, {"t": "Distributions", "f": "Min of independent exponentials X~EXP(a), Y~EXP(b)", "b": "min(X,Y) ~ EXP(a+b). P(X is the smaller) = a/(a+b). This is why CTMC exit time from a state is EXP(total outflow rate)."}, {"t": "Poisson process", "f": "Three equivalent views of a Poisson process rate λ", "b": "(1) Counts in disjoint intervals independent; N(t)~Poisson(λt). (2) Inter-arrival times iid EXP(λ). (3) In tiny h: P(1 arrival)=λh+o(h), P(≥2)=o(h)."}, {"t": "Poisson process", "f": "Superposition and decomposition", "b": "Merging independent Poisson streams λ₁,λ₂ → Poisson(λ₁+λ₂). Splitting a Poisson(λ) stream, each arrival kept independently w.p. p → Poisson(pλ), and the two substreams are independent."}, {"t": "Poisson process", "f": "How to classify a random process", "b": "Two axes: time index (discrete/continuous) × state space (discrete/continuous). Stock price over days: discrete-time, continuous-state. Count of customers: continuous-time, discrete-state. Say what the index set and the values are."}, {"t": "DTMC", "f": "Markov property (DTMC)", "b": "P(Xₙ₊₁=j | Xₙ=i, Xₙ₋₁,…,X₀) = P(Xₙ₊₁=j | Xₙ=i) = pᵢⱼ. Future depends on the present only. Homogeneous: pᵢⱼ doesn't depend on n."}, {"t": "DTMC", "f": "Rules for a transition probability matrix P", "b": "All entries ≥ 0; every ROW sums to 1 (not columns). Row i = where you go from i."}, {"t": "DTMC", "f": "n-step transition and state distribution", "b": "P(n)=Pⁿ (Chapman–Kolmogorov). Row-vector distribution: π(n)=π(0)Pⁿ, π(n+1)=π(n)P."}, {"t": "DTMC", "f": "Steady-state equations of a DTMC", "b": "Solve Y=YP (row vector) together with ΣYᵢ=1. One balance equation is redundant — drop one, use the normalisation instead."}, {"t": "DTMC", "f": "Mean sojourn time in state i (DTMC)", "b": "Stay probability pᵢᵢ each step → geometric: P(stay exactly k steps)=pᵢᵢ^(k−1)(1−pᵢᵢ). Mean = 1/(1−pᵢᵢ) STEPS. Not exponential — that is the CTMC version."}, {"t": "DTMC", "f": "Common DTMC trap: row vs column", "b": "Check ΣⱼPᵢⱼ=1 for each row. If you built the matrix from 'flow in' you may have written columns. Also: state-probability vectors are ROW vectors multiplied on the left of P."}, {"t": "Inventory DTMC", "f": "Modelling an (s,S) inventory DTMC: first steps", "b": "1) Fix when you observe (e.g. end of week, before reorder). 2) State = stock level at that moment. 3) Reorder rule: if stock ≤ s order up to S (arrives before next period). 4) Demand D~Poisson. 5) Next stock = start level − D, floored at 0 if no backorders."}, {"t": "Inventory DTMC", "f": "Inventory DTMC: how to fill a row", "b": "Start level for the row = (after-reorder level). For next state j>0 (start-level − d = j): pᵢⱼ = P(D = start−j). For next state 0 (stock-out): pᵢ₀ = P(D ≥ start) = 1 − Σ_{d<start} P(D=d). Check the row sums to 1."}, {"t": "Inventory DTMC", "f": "Why the 'zero' column is P(D ≥ s), not P(D = s)", "b": "Demand ≥ available stock empties the shelf (no backorders), all those outcomes land in state 0. Use the tail 1−P(D≤s−1)."}, {"t": "Inventory DTMC", "f": "Steady-state results you can read off from π", "b": "Long-run fraction of weeks in state i = πᵢ. Long-run mean stock = Σ i·πᵢ. Prob. of stock-out = π₀ (weigh by state at observation time)."}, {"t": "CTMC", "f": "Defining properties of a CTMC", "b": "Markov property in continuous time; time-homogeneous; the holding time in state i is EXPONENTIAL with rate νᵢ = −qᵢᵢ; then jump to j w.p. qᵢⱼ/νᵢ."}, {"t": "CTMC", "f": "Generator matrix Q: sign and sum rules", "b": "Off-diagonal qᵢⱼ ≥ 0 = rate of jumping i→j. Diagonal qᵢᵢ = −Σ_{j≠i} qᵢⱼ ≤ 0. Every ROW sums to 0."}, {"t": "CTMC", "f": "Sojourn time in state i (CTMC)", "b": "Holding time ~ EXP(−qᵢᵢ); mean = 1/(−qᵢᵢ) = 1/(total exit rate). Contrast with DTMC: there it's 1/(1−pᵢᵢ) steps, geometric."}, {"t": "CTMC", "f": "Steady-state equation of a CTMC", "b": "πQ = 0 with Σπᵢ = 1. Equivalent view: rate balance — for each state, rate OUT = rate IN."}, {"t": "CTMC", "f": "Rate-balance recipe (the lecturer's method)", "b": "Draw the state diagram. For each state j: πⱼ·(sum of rates leaving j) = Σᵢ πᵢ·(rate i→j). Write one eq per state (drop one), add Σπ=1, solve. Don't memorise a formula — read it off the diagram."}, {"t": "CTMC", "f": "Cut equations (shortcut)", "b": "Across any cut separating the diagram: flow left→right = flow right→left. For birth–death chains this gives πₖλₖ = πₖ₊₁μₖ₊₁ directly."}, {"t": "CTMC", "f": "Machine CTMC: production rate / throughput", "b": "Long-run throughput = (rate when producing) × (fraction of time producing) = p·π₁ (or μ·(1−π₀) for a queue). Use π from the rate balance, then multiply by the rate in that state."}, {"t": "CTMC", "f": "CTMC vs DTMC at a glance", "b": "Time: continuous vs discrete steps. Matrix: Q (rows→0, rates) vs P (rows→1, probabilities). Steady state: πQ=0 vs π=πP. Holding: exponential vs geometric."}, {"t": "CTMC", "f": "Resume vs discard policy (lecture Eg 9.1)", "b": "On failure while processing: RESUME keeps the partial work (picks up where it stopped); DISCARD throws the job away and restarts from setup. Different state diagram → different π."}, {"t": "Birth–death", "f": "Birth–death process: structure and balance", "b": "Transitions only k→k+1 (rate λₖ) and k→k−1 (rate μₖ). Cut balance: πₖλₖ = πₖ₊₁μₖ₊₁."}, {"t": "Birth–death", "f": "Birth–death product formula", "b": "πₖ = π₀ · Π_{i=1..k} (λ_{i−1}/μᵢ); π₀ = [1 + Σ_{k≥1} Π_{i=1..k} (λ_{i−1}/μᵢ)]⁻¹. Stable iff the series converges."}, {"t": "Queues", "f": "Kendall notation A/B/m/N", "b": "A = arrival process (M = Poisson/exp. gaps), B = service time (M = exponential), m = number of servers, N = system capacity (default ∞). M/M/2 : 2 servers; M/M/1/3 : 1 server, max 3 in system."}, {"t": "Queues", "f": "Little's law and its parts", "b": "L = λ·W (customers in system), Q = λ·D (customers in queue), W = D + 1/μ, L = Q + λ/μ. Use the EFFECTIVE arrival rate λ_eff for finite-capacity queues."}, {"t": "Queues", "f": "Utilisation / idle probability", "b": "Single server: U = 1−π₀ = ρ. Throughput = (1−π₀)μ. Multi-server M/M/m: per-server utilisation ρ = λ/(mμ)."}, {"t": "Queues", "f": "M/M/1: what to know and stability", "b": "Poisson arrivals λ, exp. service μ, 1 server, infinite room. ρ=λ/μ. Stable iff ρ<1. If ρ ≥ 1 the queue grows without bound — no steady state. Recognise the model from the wording."}, {"t": "Queues", "f": "M/M/1 results (on the appendix)", "b": "πₖ=(1−ρ)ρᵏ; π₀=1−ρ; L=ρ/(1−ρ); Q=ρ²/(1−ρ); W=1/(μ−λ); D=ρ/(μ−λ). They are on the formula sheet — know when to apply them."}, {"t": "Queues", "f": "M/M/1 waiting-time distributions (NOT on appendix)", "b": "Time in system T ~ EXP(μ−λ): P(T>t)=e^(−(μ−λ)t). Queue wait: P(W_q>t)=ρ·e^(−(μ−λ)t) for t ≥ 0, with an atom P(W_q=0)=1−ρ. Memorise these."}, {"t": "Queues", "f": "M/M/1/N: blocking, effective λ", "b": "Capacity N. π₀=(1−ρ)/(1−ρ^(N+1)); πₖ=π₀ρᵏ (k≤N); blocking prob = π_N. λ_eff=λ(1−π_N). Any ρ is allowed (finite room, always stable). Appendix W,D use nominal λ — follow the sheet unless asked for λ_eff."}, {"t": "Queues", "f": "M/M/m: key quantities and when it is stable", "b": "m servers, ρ=λ/(mμ)<1 for stability. Offered load a=λ/μ=mρ. π₀=[Σ_{k<m}(mρ)ᵏ/k! + (mρ)^m/(m!(1−ρ))]⁻¹. Queue length Q=π₀(mρ)^m ρ /(m!(1−ρ)²), L=Q+mρ, W=L/λ."}, {"t": "Queues", "f": "M/M/1 with rate 2μ vs M/M/2 vs two separate M/M/1 (Eg 5.1)", "b": "Same total capacity. Fastest: a single server with rate 2μ (W smallest). Next: pooled M/M/2. Slowest: two separate M/M/1 queues each λ/2. Pooling helps; one fast server beats two slow servers."}, {"t": "Queues", "f": "Mᵇ/M/1 (batch arrivals)", "b": "Batches of b arrive at rate λ (Poisson), service exp. μ per customer. ρ=bλ/μ<1. L=ρ(1+b)/(2(1−ρ)). Little uses the CUSTOMER rate: W=L/(λb). Same ρ as M/M/1 but bigger L because batch-mates wait."}, {"t": "Answer format", "f": "Quiz 2 answer-format checklist", "b": "Keyed-in answers marked by exact comparison. Decimals: the stated number of places, standard rounding, round once at the end (keep full precision on calculator). Fractions: a/b in simplest form. Copy every answer to paper as backup."}, {"t": "Answer format", "f": "The three misses to avoid (from the mock)", "b": "1) Inventory p_{i0}=P(D≥level) not P(D=level). 2) Sojourn: 1/(1−pᵢᵢ) for DTMC, 1/(−qᵢᵢ) for CTMC. 3) Don't leave Q4 (queues) blank — formulas are on the appendix."}, {"t": "Answer format", "f": "What the appendix gives vs what you must know", "b": "GIVEN: ρ, π₀, πₖ, L, Q, W, D for M/M/1, M/M/1/N, M/M/m, Mᵇ/M/1. NOT given: distributions, memorylessness, TPM/generator rules, steady-state equations, birth–death formula, Little's law, M/M/1 waiting-time tails, throughput."}];
let KEY='ee6204-quiz2-flashcards-v1',st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let order=CARDS.map((_,i)=>i),pos=0,flipped=false;
const $=id=>document.getElementById(id);
const topics=['All topics',...new Set(CARDS.map(c=>c.t))];
$('topic').innerHTML=topics.map(t=>`<option>${t}</option>`).join('');
function pool(){return CARDS.map((_,i)=>i).filter(i=>($('topic').value=='All topics'||CARDS[i].t==$('topic').value)&&(!$('onlyMiss').checked||st[i]=='n'))}
function rebuild(shuffle){order=pool();if(shuffle)order.sort(()=>Math.random()-.5);pos=0;flipped=false;render()}
function render(){
  const g=Object.values(st).filter(v=>v=='y').length,m=Object.values(st).filter(v=>v=='n').length;
  $('stat').textContent=`Got it: ${g} · Again: ${m} · Unseen: ${CARDS.length-g-m} · Deck: ${order.length}`;
  if(!order.length){$('tag').textContent='';$('txt').innerHTML='<div class="a">No cards in this filter.</div>';return}
  const c=CARDS[order[pos]];
  $('tag').textContent=`${c.t} — ${pos+1}/${order.length}`+(flipped?' — answer':' — question');
  $('txt').innerHTML=`<div class="${flipped?'a':'q'}"></div>`;$('txt').firstChild.textContent=flipped?c.b:c.f;
  $('h').style.visibility=flipped?'hidden':'visible';
}
const flip=()=>{flipped=!flipped;render()};
const go=d=>{if(!order.length)return;pos=(pos+d+order.length)%order.length;flipped=false;render()};
const mark=v=>{if(!order.length)return;st[order[pos]]=v;save();go(1)};
$('card').onclick=flip;$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
$('got').onclick=()=>mark('y');$('again').onclick=()=>mark('n');
$('shuf').onclick=()=>rebuild(true);$('topic').onchange=()=>rebuild(false);$('onlyMiss').onchange=()=>rebuild(false);
$('reset').onclick=()=>{st={};save();rebuild(false)};
document.onkeydown=e=>{if(e.target.tagName=='SELECT')return;if(e.key==' '){e.preventDefault();flip()}else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1)};
rebuild(true);
</script></main></body></html>
